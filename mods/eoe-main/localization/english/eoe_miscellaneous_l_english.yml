 great_war_of_restoration_will_happen_tt:0 "@warning_icon! The Path to Empire is paved with bones. This will initiate #X a#bold $great_war_of_restoration_cb$#! - no mere conflict, but a struggle against the currents of history. You shall face the mightiest [ruler|E] in these lands and their formidable alliance."
