  #Buldings
  eoe_brewery_upgrade_requirement_tt:0 "The previous Brewery level must be constructed"
  eoe_colosseum_holder_requirement_tt:0 "The holder must be Roman, Greek, or a Roman Emperor"
  eoe_hellenic_building_enabled_requirement_tt:0 "The province holder must share the local Hellenic religion or Hellenic Syncretism"
  building_type_roman_aqueduct_01:0 "Roman Waterworks"
  building_type_roman_aqueduct_01_desc:0 "In the Roman world, water passed into the settlement via aqueducts and then channelled through public fountains, baths and latrines before passing into the drains, which eventually connected to central sewers that led to a major river or sea."
  building_roman_aqueduct_01:0 "Reservoir"
  building_roman_aqueduct_01_desc:0 "Water storage was a basic but essential part of life in Roman cities. Growing populations needed a constant supply of water. A reserve could be held, in case of fire or drought, in tanks placed along the aqueducts."
  building_roman_aqueduct_02:0 "Aqueduct"
  building_roman_aqueduct_02_desc:0 "Aqueducts carrying water across many miles from mountain rivers and lakes into cities were among the greatest Roman achievements. The Romans perfected a technology that cannot be improved upon even today."
  building_roman_aqueduct_03:0 "Aqueduct Network"
  building_roman_aqueduct_03_desc:0 "Rome itself over 400 kilometres of aqueducts were built to supply water to public bath houses, fountains, drinking basins and latrines."
 
  building_type_roman_amphitheatre_01:0 "Roman Amphitheatre"
  building_type_roman_amphitheatre_01_desc:0 "The word amphitheatre means 'a theatre on both sides' and they developed from Greek circular theatres as venues for open air entertainment. Used for the richer members of the audience to show off to lesser folk, and to celebrate religious festivals, an amphitheatre's main purpose was as an arena for gladiatorial games."
  building_roman_amphitheatre_01:0 "Auditorium"
  building_roman_amphitheatre_01_desc:0 "The design of the Roman theatre was largely dependent on the Greek original. While initial versions were erected in wood for the purpose of just one performance, their increasing popularity led to official recognition in the form of monumentalised free standing structures."
  building_roman_amphitheatre_02:0 "Amphitheatre"
  building_roman_amphitheatre_02_desc:0 "The word amphitheatre means 'a theatre on both sides' and they developed from Greek circular theatres as venues for open air entertainment. Used for the richer members of the audience to show off to lesser folk, and to celebrate religious festivals, their main purpose was as an arena for gladiatorial games."
  building_roman_amphitheatre_03:0 "Circus"
  building_roman_amphitheatre_03_desc:0 "Circus has became synonymous with chariot racing but was used for all kinds of elaborate 'ludi', or games, often to celebrate religious festivals."
 
  building_type_roman_library_01:0 "Roman Library"
  building_type_roman_library_01_desc:0 "The Romans liked to think of themselves as less 'bookish' than some of their more effete Mediterranean neighbours. However, their conquests of Greece, Macedonia, Asia Minor and other knowledgeable cultures did mean they were able to collect many texts to fill archives and private collections."
  building_roman_library_01:0 "Library"
  building_roman_library_01_desc:0 "The Romans liked to think of themselves as less 'bookish' than some of their more effete Mediterranean neighbours. However, their conquests of Greece, Macedonia, Asia Minor and other knowledgeable cultures did mean they were able to collect many texts to fill archives and private collections."
  building_roman_library_02:0 "Archives"
  building_roman_library_02_desc:0 "In the roman period, Public archives were rare as most books were in the private collections of wealthy men. The first purpose-built one was at Alexandria and it held some 750,000 scrolls. By comparison, the library in Pergamum 'only' had some 200,000 scrolls in its stacks."
  building_roman_library_03:0 "Scriptorium"
  building_roman_library_03_desc:0 "Books in a Roman library were mainly written in Latin or Greek and, as in modern libraries, covered all kinds of topics from politics and economics to agriculture and poetry. Books were extremely valuable due to their scarcity and because they were all hand-copied in the scriptoria of larger libraries."

  building_eoe_palatine_palace_01:0 "Restored Palatine Palace Complex"
  building_type_eoe_palatine_palace_01:0 "Palatine Palace"
  building_type_eoe_palatine_palace_01_desc:0 "$building_eoe_palatine_palace_01_desc$"
  building_eoe_palatine_palace_01_desc:0 "After a long and laborious process the great imperial palace stands restored atop of Palatine Hill. A symbol of Roman pride and perseverance, it will serve as a reminder to future generations of Romans that our eternal city and empire shall stand forevermore."
  building_eoe_palatine_palace_02:0 "Fortified Palatine Palace Complex"
  building_eoe_palatine_palace_02_desc:0 "After a long and laborious process the great imperial palace stands restored atop of Palatine Hill. A symbol of Roman pride and perseverance, it will serve as a reminder to future generations of Romans that our eternal city and empire shall stand forevermore.\n\n However, the painful lessons of history taught us to always be vigilant. A strong fortification of the Palatine is needed to ensure that the centre of Roman administration will never again fall to any barbaric invader."
  building_eoe_temple_of_jupiter_01:0 "Temple of Jupiter Optimus Maximus"
  building_eoe_temple_of_jupiter_01_desc:0 "Rising majestically over the ancient Forum Romanum, the temple of Jupiter Optimus Maximus has risen once more. Its golden roof and majestic pillars can be seen far and wide, signaling everyone who gazes upon them the resilience and determination of the polytheistic spirit."
  building_type_eoe_temple_of_jupiter_01:0 "Roman Temple"
  building_type_eoe_temple_of_jupiter_01_desc:0 "$building_eoe_temple_of_jupiter_01_desc$"

  building_circus_of_nero_01:0 "Circus of Nero (Construction Site)"
  building_circus_of_nero_01_desc:0 "The ground has been cleared. Let the construction commence."
  building_type_circus_of_nero_01:0 "Circus of Nero"
  building_type_circus_of_nero_01_desc:0 "$building_circus_of_nero_02_desc$"
  building_circus_of_nero_02:0 "Circus of Nero"
  building_circus_of_nero_02_desc:0 "The Circus of Nero once again rises on its traditional site of Vatican Hill. The greatest chariot races in the entire Empire are held here, the envy of all the empire and beyond."

  building_temple_of_sol_invictus_01:0 "Temple of Sol Invictus (Construction Site)"
  building_temple_of_sol_invictus_01_desc:0 "The ground has been cleared. Let the construction commence."
  building_type_temple_of_sol_invictus_01:0 "Temple of Sol Invictus"
  building_type_temple_of_sol_invictus_01_desc:0 "$building_temple_of_sol_invictus_02_desc$"
  building_temple_of_sol_invictus_02:0 "Temple of Sol Invictus"
  building_temple_of_sol_invictus_02_desc:0 "Atop Vatican Hill now stands a grand temple of the Unconquered Sun, protector of the empire and our most sacred emperor."

  building_pantheon_of_constantinople_01:0 "Pantheon of Constantinople (Construction Site)"
  building_pantheon_of_constantinople_01_desc:0 "The ground has been cleared for a grand temple in the imperial capital. Let the construction commence."
  building_type_pantheon_of_constantinople_01:0 "Pantheon of Constantinople"
  building_type_pantheon_of_constantinople_01_desc:0 "A monumental temple dedicated to the gods of the restored Roman tradition in Constantinople."
  building_pantheon_of_constantinople_02:0 "Pantheon of Constantinople"
  building_pantheon_of_constantinople_02_desc:0 "The Pantheon of Constantinople stands as a monumental sanctuary to the gods and a symbol of restored Roman religious authority."
  #building_type_the_colosseum_02:0 "The Colosseum"
  #building_type_the_colosseum_02_desc:0 "The Colosseum restored to its former glory, once again the greatest arena the world had ever seen, dominating the city of Rome. Although the gladiatorial duels to death has not returned, the games at the restored Colosseum are still the foremost source of entertainment to the citzens of the Eternal City."
  
  #Vanilla Buildings
  building_type_the_colosseum_01:0 "The Colosseum"
  building_type_the_colosseum_01_desc:0 "The Colosseum was one of the largest amphitheaters ever built and has hosted countless spectacles such as gladiatorial combat, animal hunts and even reconstructed sea battles. Its construction was started by the Roman emperor Vespasian in AD 72 and was completed in AD 80 under his successor, Titus.\n\nDespite its vibrant history, its primary use today is for harvesting marble and bronze for use elsewhere."
  building_the_colosseum_01:0 "Ruins of the Colosseum"
  building_the_colosseum_01_desc:0 "$building_type_the_colosseum_01_desc$"
  building_the_colosseum_02:0 "The Restored Colosseum"
  building_the_colosseum_02_desc:0 "The Colosseum restored to its former glory, once again ruling among the Seven Hills of Rome.\n\nAlthough the days of gladiatorial combat are gone, the games at the restored Colosseum still remains as the foremost source of entertainment for the citzens of the Eternal City."
  
  building_type_aurelian_walls_01: "The Aurelian Walls"
  building_type_aurelian_walls_01_desc: "The Aurelian Walls were built during the reign of the Roman Emperors Aurelian and Probus. To this day they provide formidable defense, completely enclosing the seven hills of Rome."
  building_aurelian_walls_01: "Aurelian Walls"
  building_aurelian_walls_01_desc: "$building_type_aurelian_walls_01_desc$"
  building_aurelian_walls_02: "Renovated Aurelian Walls"
  building_aurelian_walls_02_desc: "The renovated Aurelian Walls improves the already formidable defenses of the Eternal City, rivaling the walls of Constantinople itself in size and strength."
