 sol_invictus_desc:1 "Sol was an early Roman sun deity that fell into obscurity during the First Century CE, but later brought back into prominence during the reign of Emperor Aurelian. In the years following the followers of Sol Invictus came to find themselve more and more in opposition to the emerging Christianity, developing their own distinct doctrine of belief."
