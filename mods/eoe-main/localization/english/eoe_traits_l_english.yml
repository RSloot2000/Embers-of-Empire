#Physical Greek Gods Traits Begin Here

#Aphrodite's Bloodline

 trait_blood_aphrodite_1:0 "Exalted Blood - Aphrodite"
 trait_blood_aphrodite_1_desc:0 "Somewhere in the lineage of this character must have been a descendant of one of the ancient Greek gods. The genetic markers must have lain dormant for generations. Although the bloodline is highly diluted, the effects on the individual albeit subtle can not be denied."
 trait_blood_aphrodite_1_character_desc:0 "Somewhere in the lineage of [ROOT.GetCharacter.GetFirstNameNoTooltip] must have been a descendant of one of the ancient Greek gods. The genetic markers must have lain dormant for generations. Although the bloodline is highly diluted, the effects on the individual albeit subtle can not be denied."
 trait_blood_aphrodite_2:0 "Heroic Blood - Aphrodite"
 trait_blood_aphrodite_2_desc:0 "Genetic markers within the DNA of this character strongly suggest that somewhere along his ancestry must have been an individual which was kin to one of the old gods. Great achievements are to be expected from such sublime ancestry."
 trait_blood_aphrodite_2_character_desc:0 "Genetic markers within the DNA of [ROOT.GetCharacter.GetFirstNameNoTooltip] strongly suggest that somewhere along his ancestry must have been an individual which was kin to one of the old gods. Great achievements are to be expected from such sublime ancestry."
 trait_blood_aphrodite_3:0 "Blood of Legend - Aphrodite"
 trait_blood_aphrodite_3_desc:0 "Genetic markers indicate a strong kinship with the gods themselves. It is unclear whether it was a happy coincidence that brought together two carriers of powerful genes or whether one of the old gods was directly involved in the conception. Future generations will certainly tell tales of deeds accomplished by this demigod."
 trait_blood_aphrodite_3_character_desc:0 "Genetic markers in the DNA of [ROOT.GetCharacter.GetFirstNameNoTooltip] indicate a strong kinship with the gods themselves. It is unclear whether it was a happy coincidence that brought together two carriers of powerful genes or whether one of the old gods was directly involved in the conception. Future generations will certainly tell tales of deeds accomplished by this demigod."

