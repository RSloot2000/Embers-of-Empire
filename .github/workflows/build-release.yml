name: Build release zips

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: build-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Generate release zips
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Validate descriptors and localization
        shell: pwsh
        run: ./scripts/validate-repository.ps1

      - name: Build release archives
        shell: pwsh
        run: ./scripts/build-release.ps1 -NonInteractive

      - name: Show generated artifacts
        shell: pwsh
        run: Get-ChildItem dist | Format-Table Name, Length

      - name: Upload dist as artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-zips
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Commit dist to repository
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/
          if (-not (git diff --cached --quiet)) {
            git commit -m "chore: update release zips"
            git push
            Write-Host "Committed and pushed dist/"
          } else {
            Write-Host "No changes in dist/ — nothing to commit"
          }

      - name: Open sync PR if dist is newer than source
        if: ${{ hashFiles('dist/sync-needed.json') != '' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sync = Get-Content 'dist/sync-needed.json' -Raw | ConvertFrom-Json
          $repoRoot = Get-Location

          # Build a branch name from the affected artifacts
          $artifacts = @($sync | ForEach-Object { $_.artifact })
          $branch = 'sync-dist/' + ($artifacts -join '+') + '-' + (Get-Date -Format 'yyyyMMdd-HHmmss')

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b $branch

          $changedMods = @()
          foreach ($entry in $sync) {
            $zip = Get-Item (Join-Path 'dist' "$($entry.artifact)-v$($entry.distVersion).zip")
            $extractDir = Join-Path $env:TEMP "ci-sync-$($entry.artifact)"
            if (Test-Path $extractDir) { Remove-Item $extractDir -Recurse -Force }
            Expand-Archive -Path $zip.FullName -DestinationPath $extractDir

            # Resolve the mod source directory from the "mod" field (Root/Source)
            $sourceRel = $entry.mod -replace '\\', '/'
            $sourceDir = Join-Path $repoRoot $sourceRel

            Get-ChildItem $extractDir -Recurse -File | ForEach-Object {
              $rel = $_.FullName.Substring($extractDir.Length + 1)
              $dest = Join-Path $sourceDir $rel
              New-Item -ItemType Directory -Path (Split-Path $dest) -Force | Out-Null
              Copy-Item $_.FullName $dest -Force
            }
            Remove-Item $extractDir -Recurse -Force
            $changedMods += "$($entry.artifact) ($($entry.localVersion) -> $($entry.distVersion))"
            Write-Host "Synced $($entry.artifact) source to v$($entry.distVersion)"
          }

          git add -A
          if (-not (git diff --cached --quiet)) {
            $body = "Auto-generated by the build-release workflow.`n`n" +
              "The committed `dist/` zips are newer than the local mod sources. This PR syncs the newer dist contents back into the mod source directories so the repo stays consistent.`n`n" +
              "Affected mods:`n" + (($changedMods | ForEach-Object { "- $_" }) -join "`n")
            git commit -m "chore: sync mod sources from newer dist versions"
            git push -u origin $branch
            gh pr create --title "Sync mod sources from newer dist versions" --body $body --fill
            Write-Host "Opened sync PR on branch $branch"
          } else {
            Write-Host "No source changes to sync"
          }
