name: Validate repository

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: CK3 repository checks
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Validate descriptors and localization
        shell: pwsh
        run: ./scripts/validate-repository.ps1

      - name: Validate Git LFS pointers
        shell: pwsh
        run: git lfs fsck --pointers HEAD