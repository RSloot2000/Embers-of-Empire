l_english:

    #Roman and Hellenic 

    imperial_cult:0 "Imperial Cult"
    imperial_cult_adj:0 "Imperial Cult"
    imperial_cult_adherent:0 "Imperial"
    imperial_cult_adherent_plural:0 "Imperials"
    imperial_cult_desc:0 "The Imperial Cult was the dejure state religion of the early Roman Empire that saw the worship of the living emperor as Divi Filius, or as the Son of god. Emperor Octavianus Augustus popularized the term following the deification of Iulius Caesar, his adoptive father. The title would continue throughout the following centuries until it ceased to be used as Christianity became the state religion of the Empire."

    julianism:0 "Julian Hellenism"
    julianism_adj:0 "Julianism"
    julianism_adherent:0 "Julian Hellenist"
    julianism_adherent_plural:0 "Julian Hellenist's"
    julianism_desc:0 "When emperor Julian called 'the Apostate' took to the throne of Rome in 360 BCE he sought to reform the waning Hellenistic faith by solidifying its organisational structures and codifying its many religious beliefs into a common doctrine. Similarly, he also organised the divine realm along Neoplatonic ideas, creating a hierarchy of Gods with one supreme demiurge at the centre whom he identified as Zeus-Helios."

    indo_hellenism: "Yavanadharma"
    indo_hellenism_adj: "Yavanadharmic"
    indo_hellenism_adherent: "Indo-Hellene"
    indo_hellenism_adherent_plural: "Indo-Hellenes"
    indo_hellenism_desc: "A form of Hellenic religion that grew out of the meeting of Hellenic people with Indian customs during the Indo-Greek Kingdom of antiquity, Indo-Hellenic beliefs persisted even generations after its fall."

    orphism:0 "Orphism"
    orphism_adj:0 "Orphism"
    orphism_adherent:0 "Orphian"
    orphism_adherent_plural:0 "Orphians"
    orphism_desc:0 "One of the oldest cults in the Mediterranean, dating back to at least 600 BCE, Orphism is the culmination of a millenia of Orphic Mysteries and practices among Romans and Hellenes alike, uniting elements from traditional Roman and Greek mysteries with ancient Thracian folklore and beliefs. Orpheus acts as advocate on behalf of humans as they seek to break out of the circle of rebirth and be admitted by Hades to dwell eternally in the Elysian fields."

    tenet_imperator_name:0 "Solar Imperialism"
    tenet_imperator_desc:0 "There is no difference between divine and temporal authority. Our emperor's right to rule is derived from Great Sol himself. His word is law and the law is sacred."
    tenet_neoplatonism_name:0 "Neoplatonism"
    tenet_neoplatonism_desc:0 "There is a fundamental good in this world permeating and governing all of creation. The purpose of every rigeous individual should be to discover this inherent 'Good' within themselves for it is the path to divinity itself."

    tenet_renovatio_imperii_desc:0 "Rome's glory is eternal. Blessed by Jupiter most high, Victory has crowned the brow of our emperors with the golden Laurel of triumph. Rome can not end, Rome will not end for her destiny lies beyond her borders in making all of creation her subject."
    tenet_renovatio_imperii_name:0 "Imperium Sine Fine"
    tenet_religious_legal_roman_name:0 "Divine Right"
    tenet_religious_legal_roman_desc:0 "During the imperial period, Rome gradually elevated the monarchy to a new level. The Romans extended the tradition of posthumously honoring deceased rulers to living rulers. This not only promoted the strengthening of monarchy, but also laid the foundation for the later monotheistic concept. But being viewed as a demigod also meant that higher standards were set for the ruler's behavior."
    tenet_theurgy_name:0 "Theurgy"
    tenet_theurgy_desc:0 "Through ritual practice we seek to commune with the gods so they may act as mediators between us and the highest principle. Elevating our souls and bringing us closer to the source of all being."

    tenet_light_name:0 "Lux Mundi"
    tenet_light_desc:0 "The light fears no darkness. In the end all that is good shall triumph over wickedness and falsehood. Just has the great heroes of old we dedicate our lives to fighting for the righteous cause."

    tenet_eleusinia_name:0 "Eleusinia"
    tenet_eleusinia_desc:0 "Great Demeter has blessed this earth with her countless gifts. All that is bounteous and fertile is most sacred, for just as the seasons come and go, creation is temporary and ever changing. It is our great privilege to partake in, and repay her generosity by cherishing all that which grows and lives."
    tenet_sophrosynia_name:0 "Sophrosynia"
    tenet_sophrosynia_desc:0 "Those who revel in their most base of human desires are no better than animals. It is through dicipline and the clearing of the mind from all desire that we reach true enlightenment. Therefore, let there be moderation in all things."
    tenet_bacchanalia_name:0 "Bacchanalia"
    tenet_bacchanalia_desc:0 "Father Bacchus taught us that the pleasures of life are something to be cherished. By celebrating that which was given to us we honour his teachings thus."

    sol_religious_head_title:0 "Imperator Solis"
    sol_religious_head_title_name:0 "Sun Throne"

    rf_greco_roman:0 "Greco-Roman"

    doctrine_parameter_hostility_override_greco_roman_hostility_doctrine:0 "Considers Greco-Roman [faiths|E], and is considered by Greco-Roman $game_concept_faiths$, to be [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V] instead of $hostility_astray_tooltippable$"

    incompatible_tenet_sophrosynia_trigger:0 "Sophrosynia is incompatible with Bacchanalia!"
    incompatible_tenet_bacchanalia_trigger:0 "Bacchanalia is incompatible with Bacchanalia!"

    doctrine_henotheist_name: "Henotheist"
    doctrine_henotheist_desc: "While there are many Gods one reigns supreme above all."

    k_imperium:0 "Imperium"
    d_pontificate:0 "Pontificate"

