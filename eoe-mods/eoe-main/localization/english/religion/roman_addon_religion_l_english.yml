 celto_hellenic_syncretism_adherent:0 "Taranic"
 celto_hellenic_syncretism_adherent_plural:0 "Taranics"
 celto_hellenic_syncretism_desc:0 "The Gods of the Greco-Romans and the Celtics aren’t so different from each other. For as long as the Celtic world has been in contact with the Greco-Romans of the Mediterranean, their gods have overlapped and mixed. The Celtic Galatians of Asia Minor, for example, have already combined their pantheon with that of the Greeks to form gods such as Zeus Tavianos. For cultural cohesion or assimilation into the host religion, the policy of religious synchronization will become state law."

