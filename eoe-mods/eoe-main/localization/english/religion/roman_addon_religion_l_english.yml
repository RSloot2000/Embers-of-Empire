 briton_pagan_adherent_plural:0 ""Hen Cywir"s"
 briton_pagan_desc:0 "Followers of the Old Truth, the Hen Cywirs worship the world around them as a living, breathing entity. Every nook and cranny of their world is filled with local deities. The gods of nature watch over the Britons and they resist conversion to foreign faiths, unwilling to adopt the Roman deities. The old truths have remained unhellenized. While the druids are long gone, their influence can still be felt on those who choose to look for it and follow the strict Brythonic code of conduct - Courage, Honour, Honesty, Hospitality and Loyalty."

