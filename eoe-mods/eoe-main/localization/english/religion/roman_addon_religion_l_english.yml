 britano_roman_pagan_adherent_plural:0 "Cywirs"
 britano_roman_pagan_desc:0 "Followers of the Truth, the Cywirs worship the world around them as a living, breathing entity. Every nook and cranny of their world is filled with local deities, some native to Britain, while others arrived via boat from the Hellenized world. In Yr Cywir there is no wrong or right as long as the strict Brythonic code of conduct is followed. Courage, Honour, Honesty, Hospitality and Loyalty come first."
 
