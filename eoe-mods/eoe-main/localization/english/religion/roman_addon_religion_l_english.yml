 druidism_religion:0 "Druidism"
 druidism_religion_adj:0 "Druidic"
 druidism_religion_adherent:0 "Druidist"
 druidism_religion_adherent_plural:0 "Druidists"
 druidism_religion_desc:0 "The beliefs of the ancient Celts revolved around what we call Celtic Mythology. The High Priest of these belief systems were the Druids, who were medics, astrologists, royal councillors and professors. The Romans feared the political power of these Druids to the point that they decided to wipe them off the earth."
 
