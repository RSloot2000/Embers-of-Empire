 great_project_type_eoe_restore_palatine_hill: "Restore the Palatine"
 great_project_type_eoe_restore_palatine_hill_desc: "Since the days of Augustus, Palatine Hill has been the representative seat of Roman Emperors in the city of Rome. By restoring it to its former glory, we demonstrate our dedication to Roman tradition, and our imperial ambitions to our rivals. It will also serve as a convenient base of power to establish a centralised administration in Italy and beyond."
 great_project_type_tooltip_eoe_restore_palatine_hill: "Restore the imperial palace complex on the Palatine Hill"
 great_project_name_eoe_restore_palatine_hill: "$great_project_type_eoe_restore_palatine_hill$"
