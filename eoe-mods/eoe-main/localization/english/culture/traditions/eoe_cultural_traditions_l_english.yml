#Court Positions
 pretorian_prefect_court_position:0 "Praetorian prefect"
 pretorian_prefect_employer_custom_effect_description: "$BULLET$Increases [GetTrait('varangian').GetName( GetNullCharacter )] [GetCourtPositionType('bodyguard_court_position').GetName()] [aptitude|E] (based on [aptitude|E])\n$BULLET$More eligible [courtiers|E] gain the [GetTrait('varangian').GetName( GetNullCharacter )] and [GetTrait('loyal').GetName( GetNullCharacter )] [traits|E]\n$BULLET$More Varangians will appear\n@warning_icon! #X The Varangians will claim some [gold_i] Gold after the Basileus's death.#!"
 pretorian_prefect_court_position_desc: "The $pretorian_prefect_court_position$ is the supreme commander of the Pretorian Guard."


#MAA
 comitatenses:0 "Comitatenses"
 comitatenses_flavor:0 "#F Comitatenses were the backbone of the Roman field army after the reforms under Emperor Diocletian. They are experienced elite units that can beat back any barbarian horde - if they are given their pay.#!"
 palatinae:0 "Palatinae"
 palatinae_flavor:0 "#F Palatinae, or Palace Guards, were the most experienced and elite troops fielded by the Empire. They can outmatch anyone, given enough support.#!"
 legionary_cohort:0 "Legionary Cohort"
 legionary_cohort_flavor:0 "A foremost force of professional soldiers, the Cohort is the heart and soul of the Roman imperial legions."
 legionary_cavalry:0 "Legionary Cavalry"
 legionary_cavalry_flavor:0 "Cavalry support is vital to all infantry work, even in the Legions."
 roman_ballista:0 "Ballista"
 roman_ballista_flavor:0 "Spear-sized bolts soar from these torsion-based machines into besieged settlements and enemy formations alike, causing fear and disorder."
 praetorian_cohort:0 "Praetorian Cohort"
 praetorian_cohort_flavor:0 "Hand-picked heavy infantry, the Praetorian Cohorts were the Imperial bodyguards, serving in military campaigns only when the Emperor himself was present."