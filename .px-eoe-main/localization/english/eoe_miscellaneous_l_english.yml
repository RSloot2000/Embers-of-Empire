 aspiring_wr_augustus_modifier:0 "Grand Vision of Roman Restoration"
 aspiring_wr_augustus_modifier_desc:0 "As I trace the broken columns of Jupiter's temple upon Capitoline Hill, I know the Senate's fractures shall be mended. Roads will once again lead to Rome - no idle dream, but a destiny forged by the legion's iron-shod hooves and oaths sworn in the Senate's blood."
 great_war_of_restoration_defeat_tt_imprisonment_tt:0 "You are [imprisoned|E] by your foes and may face [execution|E]"
 great_war_of_restoration_defeat_lose_titles_tt: "You forfeit all [landed|E] [titles|E] and [vassals|E]"
 great_war_of_restoration_defeat_lose_prestige_tt: "You lose the bulk of your [gold|E] and [prestige|E]"

 br_augustus_of_wr.001.t:0 "The Purple and the Eagle"
 br_augustus_of_wr.001.desc:0 "Dusk settles over Constantine's basilica. Beneath its fractured vaults, senators, bishops, and commanders wait in silence while an attendant unfolds a map of the lost western provinces.\n\nThey already address me as [Glossary( 'Augustus', 'EOE_AUGUSTUS_GLOSS' )], but a title alone cannot restore what centuries have broken. Before me lies a harsher question: shall Rome be proclaimed now, or must the West first be reunited through [Glossary( 'restitutio', 'EOE_RESTITUTIO_GLOSS' )]?"
 br_augustus_of_wr.001.a:0 "The eagle shall cross every former frontier"
 br_augustus_of_wr.001.a.flavor:0 "Issue the summons. The claim of Rome will be tested against every crown that denies it.\n\n#high #bold The $great_war_of_restoration_cb$ approaches!#!#!"
 br_augustus_of_wr.001.b:0 "The purple is authority enough"
 br_augustus_of_wr.001.b.flavor:0 "Accept the imperial dignity and consolidate what has already been won. Rome need not hazard everything in a single campaign."
 br_augustus_of_wr.001.c:0 "The hour of proclamation has not yet come"
 br_augustus_of_wr.001.c.flavor:0 "Let the court wait. A claim delayed may still be renewed; a shattered empire may not."

 br_augustus_of_wr.002.t:0 "The West Answers Rome"
 br_augustus_of_wr.002.desc:0 "The eagle-sealed ultimata return from foreign courts unopened, torn, or marked with defiance. [primary_coalition_defender.GetShortUIName|U] has become the center of resistance, and banners gather from realms that agree on little except fear of Rome's return.\n\nAt the frontier, the [Glossary( 'comitatus', 'EOE_COMITATUS_GLOSS' )] awaits the order to march. Beyond it stand kings, emirs, and princes who intend to prove that the western provinces no longer answer to an emperor."
 br_augustus_of_wr.002.a:0 "Let the judgment of arms begin"
 br_augustus_of_wr.002.a.flavor:0 "The chancery closes its ledgers. The standards are raised. There will be no second summons."

 br_augustus_of_wr.004.t:0 "The Eagle Rises in the West"
 br_augustus_of_wr.004.desc:0 "Before the assembled court, the victories are read aloud province by province. Carthage, Sicily, Dalmatia, and the two Italies again stand within one imperial order. Standards captured in war hang above the hall while the acclamations roll through Rome.\n\nThe [Glossary( 'restitutio', 'EOE_RESTITUTIO_GLOSS' )] is no longer an antiquarian dream. Law, taxation, and command now proceed in my name, and the western purple belongs to a ruler whom no neighboring court can dismiss as a mere pretender."
 br_augustus_of_wr.004.a:0 "The work of restoration has only begun"
 br_augustus_of_wr.004.a.flavor:0 "Retain the field army and take up the mantle of conquest.\n\n#high #bold Gain the Conqueror trait#!#!"
 br_augustus_of_wr.004.b:0 "Let administration secure what steel has won"
 br_augustus_of_wr.004.b.flavor:0 "The triumph ends; surveyors, judges, and tax officials follow the army into the restored provinces."
 western_roman_restoration_field_army:0 "Army of the Western Augustus"

 br_augustus_of_wr.005.t:0 "Purple in Chains"
 br_augustus_of_wr.005.desc:0 "The iron door closes, and with it the last sound of the defeated host. My captors have stripped away the standards, the seals, and every outward sign of command; only a torn edge of purple remains at my shoulder.\n\nAlready the foreign courts prepare their version of the war. To them, Rome's restoration will become a warning against ambition, and my imperial acclamation a brief madness ended in chains."
 br_augustus_of_wr.005.a:0 "Rome has endured worse than this"
 br_augustus_of_wr.005.a.flavor:0 "The empire may be denied, the army scattered, and the claimant imprisoned. The memory of Rome is harder to confine."

