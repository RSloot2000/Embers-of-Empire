 grand_marshal:0 "Grand Marshal"
 menacing_wooden_sword:0 "Menacing Wooden Sword"
 EOE_AUGUSTUS_GLOSS:0 "The imperial title first granted to Octavian and borne by Roman emperors after him. It means 'venerable' or 'majestic' and conveys supreme imperial dignity."
 EOE_RESTITUTIO_GLOSS:0 "A Roman political ideal of restoration or renewal. Imperial proclamations used it for the recovery of order, territory, institutions, or the Roman world itself."
 EOE_COMITATUS_GLOSS:0 "A late Roman field army attached to the imperial court or deployed as a mobile strategic force, distinct from troops tied permanently to a frontier."
 EOE_PRAEFECTUS_GLOSS:0 "A Roman prefect: an official entrusted with delegated military, judicial, or provincial authority in the emperor's name."
 EOE_PRAESES_GLOSS:0 "A late Roman provincial governor. A praeses supervised justice, taxation, civic administration, and public order for one province; the office was an imperial commission, not originally a medieval hereditary duchy."
 EOE_CONSULARIS_GLOSS:0 "A senior provincial governor of senatorial standing. The title marked the rank and dignity of the office; it did not mean that its current holder was serving as one of Rome's consuls."
 EOE_CORRECTOR_GLOSS:0 "A provincial governor or extraordinary supervisor charged with correcting troubled administration, especially the courts, finances, taxation, and public order."
 EOE_VICARIUS_GLOSS:0 "A delegate of higher imperial government who coordinated several provincial governors within a diocese. A vicarius therefore stood above a single province and acted in the emperor's wider administrative chain."
 EOE_FOEDUS_GLOSS:0 "A binding treaty or compact. Rome used such agreements to define obligations between the imperial government and allied peoples or rulers."
 EOE_BASILEIA_ROMAION_GLOSS:0 "The Greek expression for the 'Empire of the Romans.' Medieval Greek-speaking Romans used it for their state, emphasizing continuity with the undivided Roman Empire rather than a separate Byzantine identity."

 br_augustus_of_wr.030.t:0 "The Burden of Empire?"
 br_augustus_of_wr.030.desc:0 "Your Majesty, the decree by which you relinquish our de jure claims on the Caucasus region has spread like wildfire through the Senate and the army camps of Constantinople. Our generals are fiercely divided:\n\nSome nobles from ancient military families slam their tables in rage, calling it a betrayal of Justinian's great legacy and a surrender of strategic strongholds to our eternal Eastern rivals.\n\nYet more pragmatic officials applaud the move, believing it finally frees the Empire from an eternal war of attrition, allowing us to redirect our gold and armies to more critical fronts.\n\nThe debate has grown so heated that it requires your personal intervention once more, to either reaffirm or reconsider your decision."
 br_augustus_of_wr.030.a:0 "Uphold Tradition, Revoke the Decree"
 br_augustus_of_wr.030.a.flavor:0 "How can the domains of Rome be diminished? Every inch of land that once belonged to the Empire is a right granted by God to the Purple Chamber. The mountains of the Caucasus are our shield against Eastern invaders; to abandon our claims is to dismantle our own walls. This will only benefit the Persians or the Seljuk Turks, emboldening them further.\nThe glory of the Empire is worth more than gold—we must defend the legacy of our forebears at any cost!"
 br_augustus_of_wr.030.b:0 "Defend the Decision, Embrace Pragmatism"
 br_augustus_of_wr.030.b.flavor:0 "Glory cannot fill the treasury, nor can it block Turkish arrows. Those mountains have never been truly conquered; they devour our legions and gold, repaying us only with rebellion and friction.\nLet the local princes deal with the Seljuks—it shall become our buffer zone. For a more efficient administration, a fuller treasury, and clearer borders, it is all worthwhile. The survival of the Empire outweighs illusory glory."

 innovation_br_armies:0 "The Roman Military Legacy"
 innovation_br_armies_desc:0 "From dusty tomes and shattered reliefs, we reclaim the steel tide once guided by the Aquila. The Praetorians who guarded the throne and the disciplined Legionaries are not mere echoes of history, but blades ready to be forged anew. Now, we unlock the essence of classical military art, enabling us to raise elite forces that emulate the glory of the Empire."
 br_legionary:0 "Roman Field Legion"
 br_legionary_flavor:0 "The wildfire of the Imperial frontier. These light spearmen, armed with three javelins, sweep through hills and forests, shattering enemy flanks with volleys before driving in like a wedge—they are the vanguard who burn barbarian villages on campaign."
 br_legionarius:0 "Legion Heavy Infantry"
 br_legionarius_flavor:0 "War machines forged by iron discipline. They shatter formations with javelin throws, advance behind a shield wall, and end the chaos with the gladius—this is the bedrock of Roman conquest."
 br_sagittarii:0 "Legion Archers"
 br_sagittarii_flavor:0 "A disciplined storm of arrows. These professional archers levied from the eastern provinces blanket the sky with volleys. When the javelins fly, their arrows pour precisely into the gaps within enemy ranks—Roman victory never relies on luck."
 cohors_urbana:0 "Urban Cohort"
 cohors_urbana_flavor:0 "These bronze-helmed professionals form a death line with spear points dense as a comb's teeth. When the horn sounds, any enemy cavalry daring to breach Rome's walls becomes a sacrifice beneath their spear-tassels."
 br_equites:0 "Roman Light Cavalry"
 br_equites_flavor:0 "Mounted warriors from the frontier provinces, harassing flanks with javelins and piercing gaps with lances. They prove that beneath the Roman Aquila lies the force of a gale."
 br_praetorian:0 "Praetorian Guard"
 br_praetorian_flavor:0 "Or the Imperial Guard, the Emperor's own elite veterans sworn to his direct service—the Shield of the Emperor and the Sword of the Empire. These scale-armored elites can hold palace walls or shatter battle lines—their short swords become meat grinders in close combat."
 equites_singulares_augusti:0 "Praetorian Cavalry"
 equites_singulares_augusti_flavor:0 "The death whirlwind that follows the purple. These scale-armored heavy cavalry in gilded rings are both symbols of Imperial majesty and battering rams. The dust raised by their charge is often mistaken by routed foes for the sacred approach of the Emperor himself."

 custom_better_roman_full_borders:0 "Imperium Romanum"
 custom_western_roman_empire:0 "Western Roman Empire"

 nick_restitutor_orbis:0 "Restitutor Orbis"
 nick_restitutor_orbis_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharHaveHas(CHARACTER)] restored a united Roman Empire, and in turn, restored the world."
