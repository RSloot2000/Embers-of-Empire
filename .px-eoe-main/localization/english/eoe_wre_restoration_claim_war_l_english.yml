 eoe_wre_imperial_recovery:0 "Imperial Recovery"
 eoe_wre_imperial_recovery_desc:0 "The Western Empire is replenishing its treasury, armies, and provincial administration after a major restoration campaign."
 eoe_wre_imperial_recovery_blocks_cb:0 "The Western Empire is not undergoing Imperial Recovery"
 eoe_wre_restoration_war_active_blocks_cb:0 "No other Western Restoration War is currently active"
 eoe_wre_overextension_minor:0 "Minor Imperial Overextension"
 eoe_wre_overextension_minor_desc:0 "Even a limited restoration campaign strains the Western Empire's treasury and provincial administration."
 eoe_wre_overextension_moderate:0 "Imperial Overextension"
 eoe_wre_overextension_moderate_desc:0 "The rapid absorption of restored provinces is slowing taxation and the re-establishment of imperial control."
 eoe_wre_overextension_major:0 "Major Imperial Overextension"
 eoe_wre_overextension_major_desc:0 "A broad restoration campaign has burdened the Western Empire with unrest, damaged revenues, and an administration stretched across newly conquered lands."
 eoe_wre_overextension_severe:0 "Severe Imperial Overextension"
 eoe_wre_overextension_severe_desc:0 "The Western Empire has seized an immense territory faster than its treasury, governors, and provincial institutions can absorb it."
 eoe_wre_minor_defensive_mobilization:0 "Provincial Defense Host"
 eoe_wre_major_defensive_mobilization:0 "Grand Provincial Defense Host"
 eoe_wre_coalition_volunteers:0 "Anti-Restoration Volunteers"
 eoe_wre_restoration_coalition.001.t:0 "The Summons of the Threatened Courts"
 eoe_wre_restoration_coalition.001.desc:0 "An envoy bearing [defender.GetShortUINamePossessive] seal asks us to enter a [Glossary( 'foedus', 'EOE_FOEDUS_GLOSS' )] against [attacker.GetShortUINamePossessive] advancing restoration."
 eoe_wre_restoration_coalition.001.desc.francia:0 "The old Frankish family compact is invoked as Roman standards advance into the lands divided among Charlemagne's heirs. Kinship may inspire common defense, but every claimant also sees opportunity in another Karling's peril."
 eoe_wre_restoration_coalition.001.desc.iberia:0 "An Iberian defensive congress gathers amid rival crowns, faiths, and unsettled frontiers. Rome threatens the regional balance, yet cooperation may prove as dangerous as neutrality."
 eoe_wre_restoration_coalition.001.desc.africa:0 "Messages cross the ports and courts of Africa, calling for a league of the coast against renewed Roman conquest. Faith and fear favor resistance, while rival emirs calculate what they might gain from the crisis."
 eoe_wre_restoration_coalition.001.desc.generic:0 "The envoy speaks plainly: if the eagle advances unchecked today, another court may receive Rome's ultimatum tomorrow. Yet a common defense will demand blood, treasure, and trust between rulers who have seldom shared any of them."
 eoe_wre_restoration_coalition.001.a:0 "Join the defensive coalition"
 eoe_wre_restoration_coalition.001.b:0 "Fund the resistance"
 eoe_wre_restoration_coalition.001.c:0 "Send a volunteer host"
 eoe_wre_restoration_coalition.001.d:0 "Offer diplomatic support"
 eoe_wre_restoration_coalition.001.e:0 "Remain neutral"
 eoe_wre_restoration_coalition.001.f:0 "Exploit their distraction"
 eoe_wre_restoration_coalition.002.t:0 "A Foedus Against the Eagle"
 eoe_wre_restoration_coalition.002.desc:0 "A foreign ruler has answered [defender.GetShortUINamePossessive] appeal and entered the war against us. Their scribes call the agreement mutual defense; our chancery names it a [Glossary( 'foedus', 'EOE_FOEDUS_GLOSS' )] raised to deny lawful [Glossary( 'restitutio', 'EOE_RESTITUTIO_GLOSS' )].\n\nThe great vassals of the West now wait to learn whether the [Glossary( 'Augustus', 'EOE_AUGUSTUS_GLOSS' )] will demand their armies, their treasuries, or nothing at all."
 eoe_wre_restoration_coalition.002.a:0 "Call the great vassals before the standards"
 eoe_wre_restoration_coalition.002.b:0 "The imperial comitatus will answer alone"
 eoe_wre_restoration_coalition.003.t:0 "Before the Imperial Standards"
 eoe_wre_restoration_coalition.003.desc:0 "The summons of [attacker.GetShortUIName] is read before my court beneath the seal of the western [Glossary( 'Augustus', 'EOE_AUGUSTUS_GLOSS' )]. A foreign compact has entered the war, and the emperor now asks what my loyalty is worth.\n\nI may lead my own forces into the imperial [Glossary( 'comitatus', 'EOE_COMITATUS_GLOSS' )], open my treasury, or leave Rome to defend its claims alone."
 eoe_wre_restoration_coalition.003.a:0 "My standards will march beside the eagle"
 eoe_wre_restoration_coalition.003.b:0 "Open the treasury to the imperial envoys"
 eoe_wre_restoration_coalition.003.c:0 "The purple cannot command every sword"
 eoe_wre_restoration_claim_cb_invalidated_desc:0 "The war ends because no valid Western Roman restoration claims remain within [defender.GetShortUINamePossessive] realm."
 eoe_wre_restoration_claim_cb_victory_desc:0 "[attacker.GetShortUIName|U] seizes every marked Western Roman county claimed within [defender.GetShortUINamePossessive] realm. Holdings outside the Western Roman dioceses remain untouched."
 eoe_wre_restoration_claim_cb_white_peace_desc:0 "The restoration claims remain unresolved and may be pressed again after the truce."
 eoe_wre_restoration_claim_cb_defeat_desc:0 "[attacker.GetShortUIName|U] fails to enforce the Western Roman restoration claims. The claims remain available after the truce."