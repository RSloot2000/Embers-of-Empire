l_english:
 eoe_wre_settlement.0001.t:0 "Governors for the Restored Provinces"
 eoe_wre_settlement.0001.desc:0 "Wax tablets, family rolls, petitions, and provincial surveys cover the council table. Victory has returned these lands to Roman authority, but conquest has not yet made them governable.\n\nFirst, counties and their cities must be entrusted to restored local houses or newly established imperial families. Then each province may be placed beneath a [Glossary( 'praeses', 'EOE_PRAESES_GLOSS' )], a governor who coordinates justice, taxation, and defense in the emperor's name."
 eoe_wre_settlement.0001.a:0 "Establish imperial families in the provinces"
 eoe_wre_settlement.0001.a.tt:0 "Prominent eligible members of imperial and vassal families are offered packages of up to #V 3#! restored [counties|E]. Your direct children and important heirs are excluded. Candidates may refuse; generated imperial governors are used only as a fallback."
 eoe_wre_settlement.0001.b:0 "Confirm the local notables in Rome's name"
 eoe_wre_settlement.0001.b.tt:0 "Suitable former holders are offered the return of their local lands as your [vassals|E]. If they refuse or are unsuitable, their families, regional notables, and finally generated local governors are considered."
 eoe_wre_settlement.0010.t:0 "The Eagle Offers Reconciliation"
 eoe_wre_settlement.0010.desc:0 "An imperial envoy presents terms sealed by [eoe_wre_settlement_emperor.GetShortUIName]. If I acknowledge Roman authority and swear the required oaths, my house will receive restored lands in [eoe_wre_package_duchy.GetName] as an imperial vassal.\n\nSubmission would preserve my family's place in the province. Refusal would surrender that place to another local house."
 eoe_wre_settlement.0010.a:0 "I will govern beneath the eagle"
 eoe_wre_settlement.0010.b:0 "I will not purchase my lands with submission"
 eoe_wre_settlement.0011.t:0 "An Imperial Provincial Command"
 eoe_wre_settlement.0011.desc:0 "[eoe_wre_settlement_emperor.GetShortUIName|U] offers me a provincial command in [eoe_wre_package_duchy.GetName]. Acceptance would give my branch of the family landed authority and a lasting stake in the restored West.\n\nThe honor is considerable, but so are the risks of governing a recently conquered province far from familiar estates and alliances."
 eoe_wre_settlement.0011.a:0 "My house will serve the restored Empire"
 eoe_wre_settlement.0011.b:0 "This command is not mine to accept"
 eoe_wre_settlement.0012.t:0 "The Provincial Dignity"
 eoe_wre_settlement.0012.desc:0 "[eoe_wre_settlement_emperor.GetShortUIName|U] offers me authority over [eoe_wre_package_duchy.GetName] and its restored local counts. In Roman usage I would serve as a [Glossary( 'praeses', 'EOE_PRAESES_GLOSS' )], a provincial governor rather than an independent hereditary prince.\n\nA governor of especially high standing might be honored as [Glossary( 'consularis', 'EOE_CONSULARIS_GLOSS' )], a senior senatorial rank; one charged with repairing troubled administration might be styled [Glossary( 'corrector', 'EOE_CORRECTOR_GLOSS' )]. Whatever the title, I would coordinate provincial justice, revenues, and defense beneath the emperor."
 eoe_wre_settlement.0012.a:0 "I will govern the province in Rome's name"
 eoe_wre_settlement.0012.b:0 "I decline the provincial dignity"
 eoe_wre_settlement.0020.t:0 "The Restored Provinces Settled"
 eoe_wre_settlement.0020.desc:0 "The last seals have been affixed and the final provincial delegations dismissed. Restored local houses and newly established imperial families hold the counties, while appointed provincial governors coordinate them beneath Roman authority.\n\nAbove these governors, a [Glossary( 'vicarius', 'EOE_VICARIUS_GLOSS' )] traditionally represented higher imperial administration across an entire diocese of several provinces. Thus conquest becomes administration: local rule below, provincial coordination above it, and diocesane oversight in the emperor's name."
 eoe_wre_settlement.0020.a:0 "Let the new governors prove themselves"
 eoe_wre_imposed_ruler_resistance:0 "Resistance to Imposed Governors"
 eoe_wre_imposed_ruler_resistance_desc:0 "The people resent governors whose customs and faith were imposed by a distant imperial court."